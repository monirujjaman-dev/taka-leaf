<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F7A44" />
    <meta name="description" content="TakaLeaf - Your Money. Your Control." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>TakaLeaf</title>
    <!-- Picks the theme before the first paint, as app/theme.tsx will, so the start-up loader matches. A file, not inline: the CSP allows only scripts from this site. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app starts: the same loader as ui/AppLoader.tsx (styles in index.css). -->
      <div class="tl-boot" role="status" aria-live="polite">
        <svg aria-hidden="true" width="0" height="0" style="position: absolute">
          <defs>
            <symbol id="tl-boot-depth" viewBox="0 0 120 120">
              <g transform="translate(-11.28 -10.58) scale(0.176)" style="fill: var(--tl-leaf-depth)"><path d="M95 305 C98 215 180 112 285 110 C335 109 375 118 405 128 C370 158 345 208 318 250 C290 290 235 303 95 305Z" /><path d="M448 305 C385 345 366 410 362 480 C358 560 366 650 378 720 C420 650 446 560 448 470Z" /><path d="M715 82 C650 200 540 262 448 305 C520 310 600 305 650 270 C700 230 715 150 715 82Z" /><path d="M715 82 C640 95 560 100 500 115 C420 135 340 215 300 310 C265 400 268 520 300 610 C320 665 350 700 378 720 C366 650 358 560 362 480 C366 410 385 345 448 305 C540 262 650 200 715 82Z" /></g>
            </symbol>
            <linearGradient id="tl-boot-b" gradientUnits="userSpaceOnUse" x1="700" y1="90" x2="330" y2="720"><stop offset="0" style="stop-color: var(--tl-leaf-b0)" /><stop offset="0.45" style="stop-color: var(--tl-leaf-b1)" /><stop offset="1" style="stop-color: var(--tl-leaf-b2)" /></linearGradient>
            <linearGradient id="tl-boot-l" gradientUnits="userSpaceOnUse" x1="95" y1="305" x2="430" y2="130"><stop offset="0" style="stop-color: var(--tl-leaf-l0)" /><stop offset="1" style="stop-color: var(--tl-leaf-l1)" /></linearGradient>
          </defs>
        </svg>
        <div class="tl-loader" aria-hidden="true">
          <div class="tl-loader-solid" style="width: 130px; height: 130px">
            <div style="transform: translateZ(-1px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-2px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-3px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-4px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-5px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-6px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-7px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-8px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-9px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-10px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-11px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-12px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-13px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div><div style="transform: translateZ(-14px)"><svg width="130" height="130" viewBox="0 0 120 120"><use href="#tl-boot-depth" /></svg></div>
            <div style="transform: translateZ(1px)"><svg width="130" height="130" viewBox="0 0 120 120"><g transform="translate(-11.28 -10.58) scale(0.176)"><path d="M95 305 C98 215 180 112 285 110 C335 109 375 118 405 128 C370 158 345 208 318 250 C290 290 235 303 95 305Z" fill="url(#tl-boot-l)" /><path d="M448 305 C385 345 366 410 362 480 C358 560 366 650 378 720 C420 650 446 560 448 470Z" style="fill: var(--tl-leaf-stem)" /><path d="M715 82 C650 200 540 262 448 305 C520 310 600 305 650 270 C700 230 715 150 715 82Z" style="fill: var(--tl-leaf-right)" /><path d="M715 82 C640 95 560 100 500 115 C420 135 340 215 300 310 C265 400 268 520 300 610 C320 665 350 700 378 720 C366 650 358 560 362 480 C366 410 385 345 448 305 C540 262 650 200 715 82Z" fill="url(#tl-boot-b)" /></g></svg></div>
          </div>
          <div class="tl-loader-shadow" style="width: 117px; height: 18px; margin: 26px auto 0"></div>
        </div>
        <p class="tl-boot-label">Opening TakaLeaf…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
