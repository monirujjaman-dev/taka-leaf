    <!-- Inter has no taka sign. Ask for just ৳ from Noto Sans Bengali (4 KB) rather than the whole
         Bengali script (105 KB), which every page with an amount used to download. Bengali text
         typed into a note falls back to the system's Bengali font. -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@500..800&text=%E0%A7%B3&display=swap" rel="stylesheet" />
    <title>TakaLeaf: Your Money. Your Control.</title>
    <!-- Picks the theme before the first paint, as app/theme.tsx will, so the start-up loader matches. A file, not inline: the CSP allows only scripts from this site. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app starts: the same loader as ui/AppLoader.tsx (styles in index.css). -->
      <div class="tl-boot" role="status" aria-live="polite">
        <svg aria-hidden="true" width="0" height="0" style="position: absolute">
          <defs>
            <linearGradient id="tl-boot-b" gradientUnits="userSpaceOnUse" x1="700" y1="90" x2="330" y2="720"><stop offset="0" style="stop-color: var(--tl-leaf-b0)" /><stop offset="0.45" style="stop-color: var(--tl-leaf-b1)" /><stop offset="1" style="stop-color: var(--tl-leaf-b2)" /></linearGradient>
            <linearGradient id="tl-boot-l" gradientUnits="userSpaceOnUse" x1="95" y1="305" x2="430" y2="130"><stop offset="0" style="stop-color: var(--tl-leaf-l0)" /><stop offset="1" style="stop-color: var(--tl-leaf-l1)" /></linearGradient>
          </defs>
        </svg>
        <div class="tl-loader" aria-hidden="true">
          <div class="tl-loader-scene" style="width: 150px; height: 150px">
            <div class="tl-loader-piece" style="--x: -26px; --y: -14px; --z: 110px; animation-delay: 0ms"><svg width="150" height="150" viewBox="0 0 120 120"><g transform="translate(-11.28 -10.58) scale(0.176)"><path d="M95 305 C98 215 180 112 285 110 C335 109 375 118 405 128 C370 158 345 208 318 250 C290 290 235 303 95 305Z" fill="url(#tl-boot-l)" /></g></svg></div>
            <div class="tl-loader-piece" style="--x: 0px; --y: 26px; --z: 40px; animation-delay: 60ms"><svg width="150" height="150" viewBox="0 0 120 120"><g transform="translate(-11.28 -10.58) scale(0.176)"><path d="M448 305 C385 345 366 410 362 480 C358 560 366 650 378 720 C420 650 446 560 448 470Z" style="fill: var(--tl-leaf-stem)" /></g></svg></div>
            <div class="tl-loader-piece" style="--x: 22px; --y: -20px; --z: 150px; animation-delay: 120ms"><svg width="150" height="150" viewBox="0 0 120 120"><g transform="translate(-11.28 -10.58) scale(0.176)"><path d="M715 82 C650 200 540 262 448 305 C520 310 600 305 650 270 C700 230 715 150 715 82Z" style="fill: var(--tl-leaf-right)" /></g></svg></div>
            <div class="tl-loader-piece" style="--x: 4px; --y: 0px; --z: 75px; animation-delay: 30ms"><svg width="150" height="150" viewBox="0 0 120 120"><g transform="translate(-11.28 -10.58) scale(0.176)"><path d="M715 82 C640 95 560 100 500 115 C420 135 340 215 300 310 C265 400 268 520 300 610 C320 665 350 700 378 720 C366 650 358 560 362 480 C366 410 385 345 448 305 C540 262 650 200 715 82Z" fill="url(#tl-boot-b)" /></g></svg></div>
          </div>
          <div class="tl-loader-shadow" style="width: 120px; height: 22px; margin: 18px auto 0"></div>
        </div>
        <p class="tl-boot-label">Opening TakaLeaf…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
