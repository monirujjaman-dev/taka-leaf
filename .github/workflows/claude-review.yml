# The review agent. Claude reviews every pull request into develop or main against the project's
# rules (.claude/agents/reviewer.md), leaves inline comments, keeps one summary comment up to date,
# and passes or fails the "Claude review" check. Auto merge waits for this check; Claude fixer
# reacts when it fails. Needs the CLAUDE_CODE_OAUTH_TOKEN secret and the Claude GitHub App.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.ref }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Decide whether this PR needs a review
        id: gate
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$DRAFT" = true ]; then
            echo "Draft: reviewed when it is marked ready."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HEAD" = develop ] || [ "$HEAD" = main ]; then
            echo "Release or sync PR: every change in it was reviewed on its way into develop."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The Claude action refuses to run from a workflow file that differs from the default
          # branch, so a PR that changes this file can't be reviewed by Claude: the owner merges it.
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | grep -qx .github/workflows/claude-review.yml; then
            gh pr edit "$PR" -R "$REPO" --add-label needs-owner || true
            if ! gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -q '<!-- review-self-edit -->'; then
              gh pr comment "$PR" -R "$REPO" --body "<!-- review-self-edit -->
          This PR changes \`.github/workflows/claude-review.yml\`. Claude can't review a change to its own review workflow (a safety rule of the Claude action), so this PR waits for the owner: check it and merge it by hand."
            fi
            echo "::error::Changes the review workflow itself: the owner reviews and merges this PR."
            exit 1
          fi
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::Add the CLAUDE_CODE_OAUTH_TOKEN secret (claude setup-token, or /install-github-app in Claude Code)."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Review with Claude
        id: claude
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude fixer pushes as github-actions or claude[bot]; their PRs must still be reviewed.
          allowed_bots: "claude[bot],github-actions[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BRANCH: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }}

            You are the TakaLeaf review agent. You did not write this change; judge only the diff and
            the repository. Never change files.

            1. Read CLAUDE.md, then .claude/agents/reviewer.md: it is your checklist, in order of
               importance. Read docs/ARCHITECTURE.md for backend changes and DESIGN.md for UI changes.
            2. Read the PR (`gh pr view`) and the diff (`git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`).
               If there is an earlier "Claude review" summary comment, check whether its blocking
               findings are now fixed.
            3. For each real problem, leave one inline comment on the changed line with
               mcp__github_inline_comment__create_inline_comment (confirmed: true): what is wrong,
               a concrete scenario where it goes wrong, and the fix.
            4. Classify every finding:
               - blocking: a bug, a broken project rule (money in poisha, UserId scoping, soft
                 delete, Asia/Dhaka dates, problem responses, outbox, cache, hand-edited
                 migrations), a security issue, a missing test for user-owned data or new
                 behaviour, or docs that now contradict the code.
               - suggestion: worth doing but safe to merge without.
               Leave out style nitpicks. Do not invent problems to have something to say.
            5. verdict is "request_changes" if there is at least one blocking finding, else "approve".
               Do not post a summary comment yourself; return it in the structured output.
          claude_args: |
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'opus' }}
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api repos/*/pulls/*/comments*),Bash(gh api repos/*/issues/*/comments*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","required":["verdict","summary","findings"],"properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string","description":"Two to five plain sentences: what the change does and the overall judgement."},"findings":{"type":"array","items":{"type":"object","required":["severity","file","title"],"properties":{"severity":{"type":"string","enum":["blocking","suggestion"]},"file":{"type":"string"},"line":{"type":"integer"},"title":{"type":"string","description":"One sentence: the problem and the fix."}}}}}}'

      - name: Publish the verdict
        if: steps.gate.outputs.run == 'true'
        env:
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$OUTPUT" ] || ! jq -e .verdict >/dev/null <<<"$OUTPUT"; then
            echo "::error::Claude did not return a verdict."; exit 1
          fi
          verdict=$(jq -r .verdict <<<"$OUTPUT")
          if [ "$verdict" = approve ]; then title="✅ Approved"; add=claude:approved; remove=claude:changes-requested
          else title="❌ Changes requested"; add=claude:changes-requested; remove=claude:approved; fi
          {
            echo "<!-- claude-review -->"
            echo "## Claude review: $title"
            echo
            jq -r .summary <<<"$OUTPUT"
            echo
            jq -r '.findings | if length == 0 then "No findings." else
              (map(select(.severity=="blocking")) | if length > 0 then "**Blocking**\n" + (map("- `\(.file)\(if .line then ":\(.line)" else "" end)` \(.title)") | join("\n")) + "\n" else "" end) +
              (map(select(.severity=="suggestion")) | if length > 0 then "\n**Suggestions**\n" + (map("- `\(.file)\(if .line then ":\(.line)" else "" end)` \(.title)") | join("\n")) else "" end)
            end' <<<"$OUTPUT"
            echo
            echo "<sub>Commit ${SHA:0:7}. Blocking findings are fixed automatically by Claude fixer (label \`no-auto-fix\` turns that off).</sub>"
          } > body.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- claude-review -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md >/dev/null
          else gh pr comment "$PR" -R "$REPO" --body-file body.md; fi
          gh pr edit "$PR" -R "$REPO" --add-label "$add" --remove-label "$remove" || true
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          [ "$verdict" = approve ] || { echo "::error::Claude requested changes."; exit 1; }
