name: Android

# Builds an installable APK of the Android app, so it can be tried on a phone without Android
# Studio. Runs when the app or the shared package changes, and on demand. On main it also
# publishes the APK as the latest GitHub Release, which the web app's download links point to.
on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/shared/**", "pnpm-lock.yaml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/mobile/**", "packages/shared/**", "pnpm-lock.yaml", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EXPO_NO_TELEMETRY: 1
      EXPO_OFFLINE: 1
      # Every build gets a higher Android version code, so a new APK installs over the old one.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and unit tests
        run: pnpm --filter @takaleaf/mobile typecheck && pnpm --filter @takaleaf/mobile test
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK (signed with the debug key until A4)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: takaleaf-android-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish the APK as the latest release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          tag="android-v${version}-build.${{ github.run_number }}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk takaleaf.apk
          sha256sum takaleaf.apk > takaleaf.apk.sha256
          cat > notes.md <<NOTES
          TakaLeaf for Android ${version}, build ${{ github.run_number }}, from commit ${{ github.sha }}.

          Install: download \`takaleaf.apk\` on the phone and open it (allow "Install unknown apps" when asked).
          The web app's "Get the Android app" links always point to the newest build:
          https://github.com/${{ github.repository }}/releases/latest/download/takaleaf.apk

          Signed with the development key until milestone A4; after that, reinstall once.
          NOTES
          gh release create "$tag" takaleaf.apk takaleaf.apk.sha256 \
            --title "TakaLeaf for Android ${version} (build ${{ github.run_number }})" \
            --notes-file notes.md --target "${{ github.sha }}" --latest
