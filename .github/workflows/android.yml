name: Android

# Builds an installable APK of the Android app, so it can be tried on a phone without Android
# Studio. Runs when the app or the shared package changes, and on demand. On main it also
# publishes the APK as the latest GitHub Release, which the web app's download links point to.
on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/shared/**", "pnpm-lock.yaml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/mobile/**", "packages/shared/**", "pnpm-lock.yaml", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: 1
      EXPO_OFFLINE: 1
      # Every build gets a higher Android version code, so a new APK installs over the old one.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and unit tests
        run: pnpm --filter @takaleaf/mobile typecheck && pnpm --filter @takaleaf/mobile test
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK (signed with the debug key until A4)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: takaleaf-android-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  launch:
    name: Opens on Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
      EXPO_OFFLINE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - name: Generate the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the same release APK for the emulator (x86_64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Open the app on an Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: apps/mobile/scripts/smoke-test.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-launch-${{ github.sha }}
          path: |
            logcat.txt
            screen.png
          retention-days: 14

  publish:
    name: Publish the APK
    # Only an APK that opened on the emulator becomes the download.
    needs: [apk, launch]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: takaleaf-android-${{ github.sha }}
          path: apk
      - name: Publish the APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          tag="android-v${version}-build.${{ github.run_number }}"
          cp apk/app-release.apk takaleaf.apk
          sha256sum takaleaf.apk > takaleaf.apk.sha256
          cat > notes.md <<NOTES
          TakaLeaf for Android ${version}, build ${{ github.run_number }}, from commit ${{ github.sha }}.

          Install: download \`takaleaf.apk\` on the phone and open it (allow "Install unknown apps" when asked).
          The web app's "Get the Android app" links always point to the newest build:
          https://github.com/${{ github.repository }}/releases/latest/download/takaleaf.apk

          Signed with the development key until milestone A4; after that, reinstall once.
          NOTES
          gh release create "$tag" takaleaf.apk takaleaf.apk.sha256 \
            --title "TakaLeaf for Android ${version} (build ${{ github.run_number }})" \
            --notes-file notes.md --target "${{ github.sha }}" --latest
