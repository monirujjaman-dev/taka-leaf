# Generates an EF Core migration on a feature branch.
# To use: commit a file backend/.migration-request containing the migration name and push.
# The job adds the migration, removes the request file and commits both to the same branch.
name: EF migration

on:
  push:
    branches-ignore: [main]
    paths:
      - backend/.migration-request

permissions:
  contents: write

jobs:
  add-migration:
    name: Add migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version "10.0.*"
      - name: Add migration and commit
        env:
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=takaleaf;Username=takaleaf;Password=takaleaf_dev
        run: |
          name="$(tr -d '[:space:]' < backend/.migration-request)"
          dotnet ef migrations add "$name" --project backend/TakaLeaf.App --output-dir Data/Migrations
          git rm -q backend/.migration-request
          git add backend/TakaLeaf.App/Data/Migrations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add EF Core migration $name"
          git push
