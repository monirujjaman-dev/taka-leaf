name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web and shared package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: takaleaf
          POSTGRES_USER: takaleaf
          POSTGRES_PASSWORD: takaleaf_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U takaleaf -d takaleaf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=takaleaf;Username=takaleaf;Password=takaleaf_dev
      ConnectionStrings__Redis: localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend/TakaLeaf.App.Tests/TakaLeaf.App.Tests.csproj --configuration Release --logger "console;verbosity=detailed"
      - name: Packages in use
        run: dotnet list backend/TakaLeaf.App/TakaLeaf.App.csproj package

  image:
    name: Docker image and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image Dokploy will build
        run: docker build -t takaleaf:ci .
      - name: Start it next to PostgreSQL and Mailpit, and check it answers
        run: |
          docker network create tl
          docker run -d --name db --network tl -e POSTGRES_DB=takaleaf -e POSTGRES_USER=takaleaf -e POSTGRES_PASSWORD=ci_password postgres:18
          docker run -d --name mail --network tl -p 8025:8025 axllent/mailpit
          docker run -d --name cache --network tl redis:8-alpine
          until docker exec db pg_isready -U takaleaf -d takaleaf; do sleep 1; done
          # Production needs a data protection certificate; make a throwaway one for CI.
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes -subj "/CN=TakaLeaf CI" -keyout certs/dp.key -out certs/dp.crt
          openssl pkcs12 -export -in certs/dp.crt -inkey certs/dp.key -out certs/dataprotection.pfx -passout pass:ci_password
          chmod 644 certs/dataprotection.pfx
          docker run -d --name app --network tl -p 8080:8080 \
            -v "$PWD/certs/dataprotection.pfx:/app/certs/dataprotection.pfx:ro" \
            -e DataProtection__CertificatePassword=ci_password \
            -e ConnectionStrings__Database="Host=db;Database=takaleaf;Username=takaleaf;Password=ci_password" \
            -e ConnectionStrings__Redis="cache:6379" \
            -e Auth__SigningKey="ci-only-signing-key-0123456789-0123456789" \
            -e App__WebBaseUrl="http://localhost:8080" \
            -e Email__Host=mail -e Email__Port=1025 -e Email__Security=None \
            -e RateLimits__AuthPerMinute=1000 \
            takaleaf:ci
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          echo
          curl -fs http://localhost:8080/api/health | grep -q '"database":"up"'
          curl -fs http://localhost:8080/api/health | grep -q '"cache":"up"'
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          curl -fs http://localhost:8080/people/123 | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/nothing)" = 404
          docker exec app ls /usr/share/zoneinfo/Asia/Dhaka
          echo "Image works."
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @takaleaf/e2e exec playwright install --with-deps chromium
      - name: Browser tests (desktop and phone) against the running image
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_MAILPIT_URL: http://localhost:8025
        run: pnpm --filter @takaleaf/e2e e2e
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: App logs
        if: always()
        run: docker logs app || true

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: .NET packages (fails on high or critical)
        run: |
          dotnet list backend/TakaLeaf.App/TakaLeaf.App.csproj package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -qiE '\b(High|Critical)\b' vulnerable.txt
      - name: npm packages (fails on high or critical)
        run: pnpm audit --audit-level high
