# Local development services: PostgreSQL, Redis, a mail catcher and Seq for logs.
#   docker compose -f deploy/docker-compose.dev.yml up -d
# The password below is for local development only; production secrets never live in Git.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: takaleaf
      POSTGRES_USER: takaleaf
      POSTGRES_PASSWORD: takaleaf_dev
    ports:
      - "5432:5432"
    volumes:
      - takaleaf-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takaleaf -d takaleaf"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache for the heavy read endpoints. Set ConnectionStrings__Redis=localhost:6379 to use it;
  # without it the API caches in memory only.
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  # Catches every email the backend sends in development. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Searchable structured logs from the backend. UI and ingestion: http://localhost:5341
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - takaleaf-seq:/data

volumes:
  takaleaf-pg:
  takaleaf-seq:
